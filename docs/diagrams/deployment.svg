 fill="#000" font-size="14" textLength="132.33" font-weight="700">rootless podman</text></g><!--cluster jail--><g class="cluster" data-qualified-name="host.runtime.jail" id="ent0003" data-source-line="11"><polygon points="72,173.297,82,163.297,532,163.297,532,346.187,522,356.187,72,356.187,72,173.297" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="522" y1="173.297" x2="532" y2="163.297" style="stroke:#181818;stroke-width:1;"/><line x1="72" y1="173.297" x2="522" y2="173.297" style="stroke:#181818;stroke-width:1;"/><line x1="522" y1="173.297" x2="522" y2="356.187" style="stroke:#181818;stroke-width:1;"/><text x="246.047" y="189.292" fill="#000" font-size="14" textLength="103.906" font-weight="700">jail container</text><text x="195.71" y="205.589" fill="#000" font-size="14" textLength="204.579" font-weight="700">agentjail-&lt;profile>-&lt;pid></text><text x="151.749" y="221.886" fill="#000" font-size="14" textLength="292.503" font-weight="700">rootfs read-only, uid 10000 (keep-id)</text><text x="105.835" y="238.183" fill="#000" font-size="14" textLength="384.33" font-weight="700">bounded tmpfs: /tmp 64m, /run 16m, home 0700</text></g><!--entity classcfg--><g class="entity" data-qualified-name="host.classcfg" id="ent0006" data-source-line="17"><rect x="579.89" y="268.447" width="244.225" height="55.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="807.115,273.447,807.115,287.447,819.115,287.447,819.115,279.447,813.115,273.447,807.115,273.447" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="813.115" y1="273.447" x2="813.115" y2="279.447" style="stroke:#181818;stroke-width:0.5;"/><line x1="819.115" y1="279.447" x2="813.115" y2="279.447" style="stroke:#181818;stroke-width:0.5;"/><text x="589.89" y="294.442" fill="#000" font-size="14" textLength="214.225">gateway/classes/&lt;class>.toml</text><text x="589.89" y="310.739" fill="#000" font-size="14" textLength="182.889">model | external | internal</text></g><!--entity state--><g class="entity" data-qualified-name="host.state" id="ent0007" data-source-line="18"><rect x="245.63" y="662.677" width="280.742" height="71.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="509.372,667.677,509.372,681.677,521.372,681.677,521.372,673.677,515.372,667.677,509.372,667.677" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="515.372" y1="667.677" x2="515.372" y2="673.677" style="stroke:#181818;stroke-width:0.5;"/><line x1="521.372" y1="673.677" x2="515.372" y2="673.677" style="stroke:#181818;stroke-width:0.5;"/><text x="345.769" y="688.672" fill="#000" font-size="14" textLength="70.465" font-style="italic">«storage»</text><text x="255.63" y="704.969" fill="#000" font-size="14" textLength="58.447">state dir</text><text x="255.63" y="721.266" fill="#000" font-size="14" textLength="250.742">/.local/state/agentjail/audit/&lt;class></text></g><!--entity gateway--><g class="entity" data-qualified-name="host.runtime.gateway" id="ent0005" data-source-line="14"><polygon points="223.5,467.187,233.5,457.187,548.49,457.187,548.49,558.671,538.49,568.671,223.5,568.671,223.5,467.187" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="538.49" y1="467.187" x2="548.49" y2="457.187" style="stroke:#181818;stroke-width:0.5;"/><line x1="223.5" y1="467.187" x2="538.49" y2="467.187" style="stroke:#181818;stroke-width:0.5;"/><line x1="538.49" y1="467.187" x2="538.49" y2="568.671" style="stroke:#181818;stroke-width:0.5;"/><text x="238.5" y="490.182" fill="#000" font-size="14" textLength="130.669">gateway container</text><text x="238.5" y="506.479" fill="#000" font-size="14" textLength="248.842">agentjail-&lt;profile>-&lt;pid>-gateway</text><text x="238.5" y="522.776" fill="#000" font-size="14" textLeng