<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:1404px;height:895px;background:#FFFFFF;" width="1404px" height="895px" viewBox="0 0 1404 895" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="387.921" y="22.995" fill="#000" font-size="14" textLength="621.394" font-weight="700">agentjail: host, the per-run networks, the jail and a dual-homed class gateway</text></g><!--cluster host--><g class="cluster" data-qualified-name="host" id="ent0001" data-source-line="9"><polygon points="16,53.297,26,43.297,840,43.297,840,727.767,830,737.767,16,737.767,16,53.297" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="830" y1="53.297" x2="840" y2="43.297" style="stroke:#181818;stroke-width:1;"/><line x1="16" y1="53.297" x2="830" y2="53.297" style="stroke:#181818;stroke-width:1;"/><line x1="830" y1="53.297" x2="830" y2="737.767" style="stroke:#181818;stroke-width:1;"/><text x="406.695" y="69.292" fill="#000" font-size="14" textLength="34.61" font-weight="700">host</text></g><!--cluster runtime--><g class="cluster" data-qualified-name="host.runtime" id="ent0002" data-source-line="10"><polygon points="40,101.297,50,91.297,564,91.297,564,574.677,554,584.677,40,584.677,40,101.297" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="554" y1="101.297" x2="564" y2="91.297" style="stroke:#181818;stroke-width:1;"/><line x1="40" y1="101.297" x2="554" y2="101.297" style="stroke:#181818;stroke-width:1;"/><line x1="554" y1="101.297" x2="554" y2="584.677" style="stroke:#181818;stroke-width:1;"/><text x="210.059" y="117.292" fill="#000" font-size="14" textLength="175.882" font-style="italic">«executionEnvironment»</text><text x="231.835" y="133.589" fill="#000" font-size="14" textLength="132.33" font-weight="700">rootless podman</text></g><!--cluster jail--><g class="cluster" data-qualified-name="host.runtime.jail" id="ent0003" data-source-line="11"><polygon points="72,173.297,82,163.297,532,163.297,532,346.187,522,356.187,72,356.187,72,173.297" fill="none" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="522" y1="173.297" x2="532" y2="163.297" style="stroke:#181818;stroke-width:1;"/><line x1="72" y1="173.297" x2="522" y2="173.297" style="stroke:#181818;stroke-width:1;"/><line x1="522" y1="173.297" x2="522" y2="356.187" style="stroke:#181818;stroke-width:1;"/><text x="246.047" y="189.292" fill="#000" font-size="14" textLength="103.906" font-weight="700">jail container</text><text x="195.71" y="205.589" fill="#000" font-size="14" textLength="204.579" font-weight="700">agentjail-&lt;profile>-&lt;pid></text><text x="151.749" y="221.886" fill="#000" font-size="14" textLength="292.503" font-weight="700">rootfs read-only, uid 10000 (keep-id)</text><text x="105.835" y="238.183" fill="#000" font-size="14" textLength="384.33" font-weight="700">bounded tmpfs: /tmp 64m, /run 16m, home 0700</text></g><!--entity classcfg--><g class="entity" data-qualified-name="host.classcfg" id="ent0006" data-source-line="17"><rect x="579.89" y="268.447" width="244.225" height="55.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="807.115,273.447,807.115,287.447,819.115,287.447,819.115,279.447,813.115,273.447,807.115,273.447" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="813.115" y1="273.447" x2="813.115" y2="279.447" style="stroke:#181818;stroke-width:0.5;"/><line x1="819.115" y1="279.447" x2="813.115" y2="279.447" style="stroke:#181818;stroke-width:0.5;"/><text x="589.89" y="294.442" fill="#000" font-size="14" textLength="214.225">gateway/classes/&lt;class>.toml</text><text x="589.89" y="310.739" fill="#000" font-size="14" textLength="182.889">model | external | internal</text></g><!--entity state--><g class="entity" data-qualified-name="host.state" id="ent0007" data-source-line="18"><rect x="245.63" y="666.177" width="280.742" height="55.594" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="509.372,671.177,509.372,685.177,521.372,685.177,521.372,677.177,515.372,671.177,509.372,671.177" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="515.372" y1="671.177" x2="515.372" y2="677.177" style="stroke:#181818;stroke-width:0.5;"/><line x1="521.372" y1="677.177" x2="515.372" y2="677.177" style="stroke:#181818;stroke-width:0.5;"/><text x="255.63" y="692.172" fill="#000" font-size="14" textLength="58.447">state dir</text><text x="255.63" y="708.469" fill="#000" font-size="14" textLength="250.742">/.local/state/agentjail/audit/&lt;class></text></g><!--entity gateway--><g class="entity" data-qualified-name="host.runtime.gateway" id="ent0005" data-source-line="14"><polygon points="223.5,467.187,233.5,457.187,548.49,457.187,548.49,558.671,538.49,568.671,223.5,568.671,223.5,467.187" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="538.49" y1="467.187" x2="548.49" y2="457.187" style="stroke:#181818;stroke-width:0.5;"/><line x1="223.5" y1="467.187" x2="538.49" y2="467.187" style="stroke:#181818;stroke-width:0.5;"/><line x1="538.49" y1="467.187" x2="538.49" y2="568.671" style="stroke:#181818;stroke-width:0.5;"/><text x="238.5" y="490.182" fill="#000" font-size="14" textLength="130.669">gateway container</text><text x="238.5" y="506.479" fill="#000" font-size="14" textLength="248.842">agentjail-&lt;profile>-&lt;pid>-gateway</text><text x="238.5" y="522.776" fill="#000" font-size="14" textLength="272.754">dual-homed: DNS :53, CONNECT :3128</text><text x="238.5" y="539.073" fill="#000" font-size="14" textLength="257.51">image pinned by ID, read-only rootfs</text><text x="238.5" y="555.369" fill="#000" font-size="14" textLength="284.99">all caps dropped but NET_BIND_SERVICE</text></g><!--entity init--><g class="entity" data-qualified-name="host.runtime.jail.init" id="ent0004" data-source-line="12"><rect x="95.85" y="260.297" width="272.307" height="71.891" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><polygon points="351.157,265.297,351.157,279.297,363.157,279.297,363.157,271.297,357.157,265.297,351.157,265.297" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="357.157" y1="265.297" x2="357.157" y2="271.297" style="stroke:#181818;stroke-width:0.5;"/><line x1="363.157" y1="271.297" x2="357.157" y2="271.297" style="stroke:#181818;stroke-width:0.5;"/><text x="105.85" y="286.292" fill="#000" font-size="14" textLength="234.165">PID 1 chain, from the base image</text><text x="105.85" y="302.589" fill="#000" font-size="14" textLength="242.307">tini → agentjail-entrypoint → agent</text><text x="105.85" y="318.886" fill="#000" font-size="14" textLength="235.102">(the launcher is not in run's path)</text></g><!--entity destination--><g class="entity" data-qualified-name="destination" id="ent0008" data-source-line="21"><path d="M864.532,671.903 C871.212,663.148 877.58,663.33 883.462,672.735 C887.46,665.119 893.901,665.715 898.547,672.032 C903.399,663.202 911.814,662.615 917.712,670.859 C923.173,662.185 929.408,661.4 935.525,670.189 C940.56,660.591 947.788,661.957 953.509,669.467 C960.092,661.449 966.446,661.582 970.648,671.715 C974.596,664.052 982.888,662.505 987.623,670.882 C993.007,661.494 998.669,662.71 1004.609,670.325 C1009.943,664.178 1014.591,663.587 1019.827,670.44 C1025.543,660.845 1033.527,662.201 1038.299,671.369 C1043.489,663.317 1049.768,663.099 1055.308,670.997 C1060.825,663.512 1068.16,663.876 1072.785,671.996 C1078.077,663.719 1086.577,662.577 1091.151,672.712 C1096.05,664.647 1101.019,664.775 1106.191,672.452 C1120.358,675.799 1125.02,683.029 1115.546,695.835 C1122.104,705.16 1121.331,715.168 1108.029,717.651 C1104.743,725.731 1096.912,725.965 1091.651,719.943 C1085.917,728.834 1076.989,726.835 1072.39,718.661 C1068.392,726.535 1061.095,726.193 1056.168,719.71 C1050.014,729.258 1043.198,728.026 1037.035,719.72 C1033.024,726.824 1025.357,727.463 1020.687,720.484 C1014.716,728.03 1008.104,728.212 1003.457,719.114 C997.78,728.533 992.074,728.799 985.449,720.053 C979.83,727.812 974.842,728.79 969.165,720.11 C964.83,730.504 957.171,731.158 950.951,721.853 C945.053,728.777 937.895,728.107 933.452,720.142 C928.379,726.671 922.103,727.433 917.665,719.45 C914.06,729.102 905.475,728.931 900.437,720.841 C894.097,729.725 885.603,726.696 882.536,717.585 C878.779,726.401 870.529,726.338 865.921,718.43 C854.408,714.681 849.546,708.057 857.696,696.823 C848.593,685.106 849.417,676.977 864.532,671.903" style="stroke:#181818;stroke-width:0.5;" fill="#F1F1F1"/><text x="870.83" y="690.672" fill="#000" font-size="14" textLength="228.348">destination on the class allowlist</text><text x="870.83" y="706.969" fill="#000" font-size="14" textLength="228.225">host:port, exact name or *.suffix</text></g><g class="entity" data-qualified-name="netnote" id="ent0013" data-source-line="29"><path d="M858.76,276.107 L858.76,316.373 L1389.236,316.373 L1389.236,286.107 L1379.236,276.107 L858.76,276.107" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1379.236,276.107 L1379.236,286.107 L1389.236,286.107 L1379.236,276.107" style="stroke:#181818;stroke-width:1;" fill="#FEFFDD"/><text x="864.76" y="293.174" fill="#000" font-size="13" textLength="509.476">PlantUML has no element for a container network, so the communication path</text><text x="864.76" y="308.307" fill="#000" font-size="13" textLength="423.439">carries a «network» stereotype to name the one the run creates.</text></g><!--link classcfg to gateway--><g class="link" data-entity-1="ent0006" data-entity-2="ent0005" id="lnk9" data-source-line="23" data-link-type="dependency"><path d="M661.98,324.437 C613.23,357.547 533.826,411.497 471.386,453.917" style="stroke:#181818;stroke-width:1;" fill="none" id="classcfg-to-gateway"/><polygon points="467.25,456.727,476.942,454.978,471.386,453.917,472.447,448.361,467.25,456.727" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="573.3" y="408.254" fill="#000" font-size="13" textLength="334.166">bind-mounted read-only at /etc/agentjail/class.toml</text></g><!--link jail to gateway--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk10" data-source-line="24" data-link-type="association"><path d="M396.295,356.454 C396.065,356.919 395.829,357.381 395.587,357.839 C394.618,359.672 393.553,361.444 392.381,363.137 C390.037,366.522 387.268,369.589 384,372.187 C363.11,388.797 162.55,361.007 144,380.187 C103.43,422.137 156.49,454.027 223.15,475.907" style="stroke:#181818;stroke-width:1;" fill="none" id="jail-gateway"/><text x="145" y="393.254" fill="#000" font-size="13" textLength="302.352">«network» agentjail-&lt;profile>-&lt;pid>-&lt;class></text><text x="153.725" y="408.387" fill="#000" font-size="13" textLength="284.902">internal=true, IPv4 only, no upstream route</text><text x="196.191" y="423.519" fill="#000" font-size="13" textLength="199.97">its only two peers on that path</text></g><!--link gateway to destination--><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" id="lnk11" data-source-line="25" data-link-type="association"><path d="M548.8,529.907 C637.22,542.297 747.14,563.817 840,600.677 C878.55,615.977 917.99,641.867 945.98,662.347" style="stroke:#181818;stroke-width:1;" fill="none" id="gateway-destination"/><text x="899.66" y="613.744" fill="#000" font-size="13" textLength="291.434">«network» agentjail-&lt;profile>-&lt;pid>-egress</text><text x="952.336" y="628.877" fill="#000" font-size="13" textLength="186.082">CONNECT after resolve once</text></g><!--link gateway to state--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk12" data-source-line="26" data-link-type="dependency"><path d="M386,569.107 C386,601.167 386,635.147 386,660.707" style="stroke:#181818;stroke-width:1;" fill="none" id="gateway-to-state"/><polygon points="386,665.707,390,656.707,386,660.707,382,656.707,386,665.707" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="393.262" y="613.744" fill="#000" font-size="13" textLength="150.033">audit and dns streams,</text><text x="387" y="628.877" fill="#000" font-size="13" textLength="162.557">bind-mounted read-write</text></g><g class="legend" data-source-line="33"><rect x="421.295" y="768.767" width="554.646" height="107.781" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="426.295" y="786.762" fill="#000" font-size="14" textLength="525.704">The class is decided by network membership, not by a rule inside a shared</text><text x="426.295" y="803.059" fill="#000" font-size="14" textLength="522.033">proxy: the jail joins the per-run network named after its class and the only</text><text x="426.295" y="819.356" fill="#000" font-size="14" textLength="541.078">other peer on it is that class's gateway, which is also the only member of the</text><text x="426.295" y="835.653" fill="#000" font-size="14" textLength="544.646">egress network. model, external and internal are three instances of the same</text><text x="426.295" y="851.949" fill="#000" font-size="14" textLength="243.681">binary with three different configs.</text><text x="426.295" y="868.246" fill="#000" font-size="14" textLength="428.641">Jail: no host file, no runtime socket, no unlisted environment.</text></g><?plantuml-src ZLRRRkCs47ttLmnSe4aAoKwwbnPkQg1DWY95cmPDkay65hGuihcHI86auXYzFFO3-Xlx2NtRJ-cNz0mbsIvs2smGn3H5dJaySsOcH_JBZp-GvgPosvfj96tKogkQdAssCx9ESyZetLj-ugADnjah-sYyitBstT_oHFbeIbNW6ochHqTKkBfkhIcK7AT6nJKGy0XWvE