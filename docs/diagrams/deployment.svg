ay--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk10" data-source-line="24" data-link-type="association"><path d="M396.295,356.454 C396.065,356.919 395.829,357.381 395.587,357.839 C394.618,359.672 393.553,361.444 392.381,363.137 C390.037,366.522 387.268,369.589 384,372.187 C363.11,388.797 162.55,361.017 144,380.187 C103.43,422.137 156.49,454.027 223.15,475.917" style="stroke:#181818;stroke-width:1;" fill="none" id="jail-gateway"/><text x="145" y="393.254" fill="#000" font-size="13" textLength="302.352">«network» agentjail-&lt;profile>-&lt;pid>-&lt;class></text><text x="153.725" y="408.387" fill="#000" font-size="13" textLength="284.902">internal=true, IPv4 only, no upstream route</text><text x="196.191" y="423.519" fill="#000" font-size="13" textLength="199.97">its only two peers on that path</text></g><!--link gateway to destination--><g class="link" data-entity-1="ent0005" data-entity-2="ent0008" id="lnk11" data-source-line="25" data-link-type="association"><path d="M548.87,529.047 C637.43,541.187 747.47,562.747 840,600.677 C879.93,617.047 920.33,645.227 948.31,667.007" style="stroke:#181818;stroke-width:1;" fill="none" id="gateway-destination"/><text x="899.97" y="613.744" fill="#000" font-size="13" textLength="291.434">«network» agentjail-&lt;profile>-&lt;pid>-egress</text><text x="952.646" y="628.877" fill="#000" font-size="13" textLength="186.082">CONNECT after resolve once</text></g><!--link gateway to state--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk12" data-source-line="26" data-link-type="dependency"><path d="M386,569.047 C386,599.267 386,630.847 386,657.247" style="stroke:#181818;stroke-width:1;" fill="none" id="gateway-to-state"/><polygon points="386,662.247,390,653.247,386,657.247,382,653.247,386,662.247" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="393.262" y="613.744" fill="#000" font-size="13" textLength="150.033">audit and dns streams,</text><text x="387" y="628.877" fill="#000" font-size="13" textLength="162.557">bind-mounted read-write</text></g><g class="legend" data-source-line="28"><rect x="322.879" y="781.567" width="554.646" height="107.781" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="327.879" y="799.562" fill="#000" font-size="14" textLength="525.704">The class is decided by network membership, not by a rule inside a shared</text><text x="327.879" y="815.859" fill="#000" font-size="14" textLength="522.033">proxy: the jail joins the per-run network named after its class and the only</text><text x="327.879" y="832.156" fill="#000" font-size="14" textLength="541.078">other peer on it is that class's gateway, which is also the only member of the</text><text x="327.879" y="848.453" fill="#000" font-size="14" textLength="544.646">egress network. model, external and internal are three instances of the same</text><text x="327.879" y="864.749" fill="#000" font-size="14" textLength="243.681">binary with three different configs.</text><text x="327.879" y="881.046" fill="#000" font-size="14" textLength="428.641">Jail: no host file, no runtime socket, no unlisted environment.</text></g><?plantuml-src ZLLjRkCs4FslKmnSe4aAIKwwsMtXfWRQ95YaQDEWIVUNWGKjZcnkA58WgJX6Ftxs0Bt67g7_SfIUf8-KPAVe5jZ0Y6cHUlFcpPlX0Vtym_SakTLssx0999LOET6GDNex8sCb-voUtlCZLrrGrboQ1-MiYMUV_eexmWLLYmg_I1YP7L1bcwOpgXBnEBKYh860BO2H3Mjs-nWkHMVDANJOjbpIDsGuRAox9-M19X82BV6CsGnCMOul0Thm0p25sU7OcbJmP3Uc1C2jxLp5yQ7ZoZf9DS9AM_dfG0EBNVgbVrYLT671DH1B1L9hfjithsT0Scma8k7XHe5It6cLCI1peuK9CHNLY1NJOO8NqhP1cLNPoAD8vDDFJbz-bVuXC-IbLM0dD4sAOZBRGpWMqbDH17uCHK72amzEtRFjGfa55JGJOfZmJYWzexNr8U-fi2jSPqRrVFyqdahY2vATqCNQDk1RQU4zhKJWZTXcMQmoJIBK9CQB2_eb8-gVEsiH5ETRAnjX9dHszY4tpEVnNJ08gk7q-WYGE5JM1A4CkuNPqI_EMcThfNcEbPBpXOcnQfyqAA83S-gKf9DZ_D7XFNDRA7cqC4lReHIIGjFMVaPJVDEhqoQdQLJWv1LMCL4w_kBuEAMKAFISY4R7qkJcwe9Eg5g3M4wriqtIR2ayzvLS81cZwEy__jnhNk3RRLkhuBJTni8SnZUrw4mL7Ou2HmSf4mKvyCd3Hua9y4BYyTipXOPAV9H8nN1uOVO5dT75zItDNhx8wVp7w-lByp