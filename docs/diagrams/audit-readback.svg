ext></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg2" data-source-line="13"><polygon points="562.651,194.555,572.651,198.555,562.651,202.555,566.651,198.555" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="207.617" y1="198.555" x2="568.651" y2="198.555" style="stroke:#181818;stroke-width:1;"/><text x="214.617" y="178.356" fill="#000" font-size="13" textLength="108.488">&lt;jail-id>.dns.log</text><text x="214.617" y="193.489" fill="#000" font-size="13" textLength="343.034">one line per query: answer, nxdomain, refused, drop</text></g><path d="M15,211.555 L15,251.555 L400,251.555 L400,221.555 L390,211.555 L15,211.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M390,211.555 L390,221.555 L400,221.555 L390,211.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="228.622" fill="#000" font-size="13" textLength="364.235">written at decision time, not when the connection ends:</text><text x="21" y="243.754" fill="#000" font-size="13" textLength="357.963">a tunnel that is established and then reset is still a line</text><text x="545.141" y="281.031" fill="#000" font-size="11" textLength="244.267">gateway container removed (--rm), jail gone</text><path d="M405.574,302.625 L405.574,327.625 L743.574,327.625 L743.574,312.625 L733.574,302.625 L405.574,302.625" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M733.574,302.625 L733.574,312.625 L743.574,312.625 L733.574,302.625" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="411.574" y="319.692" fill="#000" font-size="13" textLength="317.154">the record is this directory, not the container log</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg3" data-source-line="17"><polygon points="585.651,365.023,575.651,369.023,585.651,373.023,581.651,369.023" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="579.651" y1="369.023" x2="923.622" y2="369.023" style="stroke:#181818;stroke-width:1;"/><text x="591.651" y="348.825" fill="#000" font-size="13" textLength="325.971">prune at start: keep the newest 20 runs per class,</text><text x="591.651" y="363.958" fill="#000" font-size="13" textLength="191.28">delete both files of the oldest</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg4" data-source-line="18"><polygon points="585.651,409.289,575.651,413.289,585.651,417.289,581.651,413.289" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="579.651" y1="413.289" x2="1125.931" y2="413.289" style="stroke:#181818;stroke-width:1;"/><text x="591.651" y="393.09" fill="#000" font-size="13" textLength="234.609">read both streams, newest run first,</text><text x="591.651" y="408.223" fill="#000" font-size="13" textLength="130.768">merge in time order</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg5" data-source-line="19"><polygon points="1114.931,453.555,1124.931,457.555,1114.931,461.555,1118.931,457.555" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="574.651" y1="457.555" x2="1120.931" y2="457.555" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="581.651" y="437.356" fill="#000" font-size="13" textLength="178.82">key=value lines, filtered by</text><text x="581.651" y="452.489" fill="#000" font-size="13" textLength="175.297">class, jail, decision, stream</text></g><path d="M877.207,470.555 L877.207,510.555 L1376.207,510.555 L1376.207,480.555 L1366.207,470.555 L877.207,470.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1366.207,470.555 L1366.207,480.555 L1376.207,480.555 L1366.207,470.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="883.207" y="487.622" fill="#000" font-size="13" textLength="478.448">With no per-run files, t