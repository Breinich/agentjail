<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1251px;height:704px;background:#FFFFFF;" width="1251px" height="704px" viewBox="0 0 1251 704" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="7"><text x="458.714" y="27.995" fill="#000" font-size="14" textLength="331.919" font-weight="700">audit: the evidence outlives the container</text></g><g class="participant-lifeline" data-qualified-name="G" data-entity-uid="part1" id="part1-lifeline" data-source-line="9"><g><title>gateway container</title><rect x="204.117" y="94.891" width="8" height="161.93" fill="#000" fill-opacity="0"/><line x1="207.617" y1="94.891" x2="207.617" y2="256.82" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><line x1="207.617" y1="256.82" x2="207.617" y2="297.625" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:1,4;"/><g><title>gateway container</title><rect x="204.117" y="297.625" width="8" height="348.125" fill="#000" fill-opacity="0"/><line x1="207.617" y1="297.625" x2="207.617" y2="645.75" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g></g><g class="participant-lifeline" data-qualified-name="S" data-entity-uid="part2" id="part2-lifeline" data-source-line="10"><g><title>state dir</title><rect x="571.151" y="94.891" width="8" height="161.93" fill="#000" fill-opacity="0"/><line x1="574.651" y1="94.891" x2="574.651" y2="256.82" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><line x1="574.651" y1="256.82" x2="574.651" y2="297.625" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:1,4;"/><g><title>state dir</title><rect x="571.151" y="297.625" width="8" height="348.125" fill="#000" fill-opacity="0"/><line x1="574.651" y1="297.625" x2="574.651" y2="645.75" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g></g><g class="participant-lifeline" data-qualified-name="R" data-entity-uid="part3" id="part3-lifeline" data-source-line="11"><g><title>next run of the class</title><rect x="921.122" y="94.891" width="8" height="161.93" fill="#000" fill-opacity="0"/><line x1="924.622" y1="94.891" x2="924.622" y2="256.82" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><line x1="924.622" y1="256.82" x2="924.622" y2="297.625" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:1,4;"/><g><title>next run of the class</title><rect x="921.122" y="297.625" width="8" height="348.125" fill="#000" fill-opacity="0"/><line x1="924.622" y1="297.625" x2="924.622" y2="645.75" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g></g><g class="participant-lifeline" data-qualified-name="A" data-entity-uid="part4" id="part4-lifeline" data-source-line="12"><g><title>operator</title><rect x="1123.431" y="94.891" width="8" height="161.93" fill="#000" fill-opacity="0"/><line x1="1126.931" y1="94.891" x2="1126.931" y2="256.82" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g><line x1="1126.931" y1="256.82" x2="1126.931" y2="297.625" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:1,4;"/><g><title>operator</title><rect x="1123.431" y="297.625" width="8" height="348.125" fill="#000" fill-opacity="0"/><line x1="1126.931" y1="297.625" x2="1126.931" y2="645.75" style="stroke:#181818;stroke-width:0.5;stroke-dasharray:5,5;"/></g></g><g class="participant participant-head" data-qualified-name="G" data-entity-uid="part1" id="part1-head" data-source-line="9"><rect x="135.283" y="47.297" width="144.669" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="142.283" y="67.292" fill="#000" font-size="14" textLength="130.669">gateway container</text><text x="158.908" y="83.589" fill="#000" font-size="14" textLength="97.419">class &lt;class></text></g><g class="participant participant-head" data-qualified-name="S" data-entity-uid="part2" id="part2-head" data-source-line="10"><rect x="442.28" y="47.297" width="264.742" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="545.427" y="67.292" fill="#000" font-size="14" textLength="58.447">state dir</text><text x="449.28" y="83.589" fill="#000" font-size="14" textLength="250.742">/.local/state/agentjail/audit/&lt;class></text></g><g class="participant participant-head" data-qualified-name="R" data-entity-uid="part3" id="part3-head" data-source-line="11"><rect x="845.729" y="47.297" width="157.787" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="852.729" y="67.292" fill="#000" font-size="14" textLength="143.787">next run of the class</text><text x="880.302" y="83.589" fill="#000" font-size="14" textLength="88.642">agentjail run</text></g><g class="participant participant-head" data-qualified-name="A" data-entity-uid="part4" id="part4-head" data-source-line="12"><rect x="1013.516" y="47.297" width="226.83" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1096.825" y="67.292" fill="#000" font-size="14" textLength="60.211">operator</text><text x="1020.516" y="83.589" fill="#000" font-size="14" textLength="212.83">agentjail audit --class &lt;class></text></g><g class="participant participant-tail" data-qualified-name="G" data-entity-uid="part1" id="part1-tail" data-source-line="9"><rect x="135.283" y="645.75" width="144.669" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="142.283" y="665.745" fill="#000" font-size="14" textLength="130.669">gateway container</text><text x="158.908" y="682.042" fill="#000" font-size="14" textLength="97.419">class &lt;class></text></g><g class="participant participant-tail" data-qualified-name="S" data-entity-uid="part2" id="part2-tail" data-source-line="10"><rect x="442.28" y="645.75" width="264.742" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="545.427" y="665.745" fill="#000" font-size="14" textLength="58.447">state dir</text><text x="449.28" y="682.042" fill="#000" font-size="14" textLength="250.742">/.local/state/agentjail/audit/&lt;class></text></g><g class="participant participant-tail" data-qualified-name="R" data-entity-uid="part3" id="part3-tail" data-source-line="11"><rect x="845.729" y="645.75" width="157.787" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="852.729" y="665.745" fill="#000" font-size="14" textLength="143.787">next run of the class</text><text x="880.302" y="682.042" fill="#000" font-size="14" textLength="88.642">agentjail run</text></g><g class="participant participant-tail" data-qualified-name="A" data-entity-uid="part4" id="part4-tail" data-source-line="12"><rect x="1013.516" y="645.75" width="226.83" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1096.825" y="665.745" fill="#000" font-size="14" textLength="60.211">operator</text><text x="1020.516" y="682.042" fill="#000" font-size="14" textLength="212.83">agentjail audit --class &lt;class></text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1" data-source-line="14"><line x1="572.651" y1="154.289" x2="562.651" y2="150.289" style="stroke:#181818;stroke-width:1;"/><line x1="572.651" y1="154.289" x2="562.651" y2="158.289" style="stroke:#181818;stroke-width:1;"/><line x1="207.617" y1="154.289" x2="573.651" y2="154.289" style="stroke:#181818;stroke-width:1;"/><text x="214.617" y="118.958" fill="#000" font-size="13" textLength="118.39">&lt;jail-id>.audit.log</text><text x="214.617" y="134.09" fill="#000" font-size="13" textLength="304.408">one line per decision: allow (resolved, pinned),</text><text x="214.617" y="149.223" fill="#000" font-size="13" textLength="221.038">allow-close (bytes), deny (reason)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg2" data-source-line="15"><line x1="572.651" y1="198.555" x2="562.651" y2="194.555" style="stroke:#181818;stroke-width:1;"/><line x1="572.651" y1="198.555" x2="562.651" y2="202.555" style="stroke:#181818;stroke-width:1;"/><line x1="207.617" y1="198.555" x2="573.651" y2="198.555" style="stroke:#181818;stroke-width:1;"/><text x="214.617" y="178.356" fill="#000" font-size="13" textLength="108.488">&lt;jail-id>.dns.log</text><text x="214.617" y="193.489" fill="#000" font-size="13" textLength="343.034">one line per query: answer, nxdomain, refused, drop</text></g><path d="M15,211.555 L15,251.555 L400,251.555 L400,221.555 L390,211.555 L15,211.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M390,211.555 L390,221.555 L400,221.555 L390,211.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="228.622" fill="#000" font-size="13" textLength="364.235">written at decision time, not when the connection ends:</text><text x="21" y="243.754" fill="#000" font-size="13" textLength="357.963">a tunnel that is established and then reset is still a line</text><text x="341.104" y="281.031" fill="#000" font-size="11" textLength="652.341">run over: the jail, started with --rm, is gone; the gateway, which has no --rm, was removed by the run's cleanup guard</text><path d="M320.995,302.625 L320.995,372.625 L827.995,372.625 L827.995,312.625 L817.995,302.625 L320.995,302.625" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M817.995,302.625 L817.995,312.625 L827.995,312.625 L817.995,302.625" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="326.995" y="319.692" fill="#000" font-size="13" textLength="480.822">The record is this directory, not the container log. The gateway carries no</text><text x="326.995" y="334.825" fill="#000" font-size="13" textLength="469.739">--rm on purpose: a gateway that refuses to start keeps its exit code and</text><text x="326.995" y="349.958" fill="#000" font-size="13" textLength="486.313">its output, which is how the refusal is reported. A gateway left behind by a</text><text x="326.995" y="365.09" fill="#000" font-size="13" textLength="303.132">killed run is pruned by dead pid on a later run.</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg3" data-source-line="24"><polygon points="585.651,410.422,575.651,414.422,585.651,418.422,581.651,414.422" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="579.651" y1="414.422" x2="923.622" y2="414.422" style="stroke:#181818;stroke-width:1;"/><text x="591.651" y="394.223" fill="#000" font-size="13" textLength="325.971">prune at start: keep the newest 20 runs per class,</text><text x="591.651" y="409.356" fill="#000" font-size="13" textLength="191.28">delete both files of the oldest</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg4" data-source-line="25"><polygon points="912.622,439.555,922.622,443.555,912.622,447.555,916.622,443.555" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="574.651" y1="443.555" x2="918.622" y2="443.555" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="581.651" y="438.489" fill="#000" font-size="13" textLength="162.703">the files it deleted, if any</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg5" data-source-line="26"><polygon points="585.651,483.82,575.651,487.82,585.651,491.82,581.651,487.82" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="579.651" y1="487.82" x2="1125.931" y2="487.82" style="stroke:#181818;stroke-width:1;"/><text x="591.651" y="467.622" fill="#000" font-size="13" textLength="234.609">read both streams, newest run first,</text><text x="591.651" y="482.754" fill="#000" font-size="13" textLength="130.768">merge in time order</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg6" data-source-line="27"><polygon points="1114.931,528.086,1124.931,532.086,1114.931,536.086,1118.931,532.086" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="574.651" y1="532.086" x2="1120.931" y2="532.086" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="581.651" y="511.887" fill="#000" font-size="13" textLength="178.82">key=value lines, filtered by</text><text x="581.651" y="527.02" fill="#000" font-size="13" textLength="175.297">class, jail, decision, stream</text></g><path d="M456.758,545.086 L456.758,630.086 L1244.758,630.086 L1244.758,555.086 L1234.758,545.086 L456.758,545.086" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1234.758,545.086 L1234.758,555.086 L1244.758,555.086 L1234.758,545.086" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="594.543" y="562.153" fill="#000" font-size="13" textLength="462.941">Synchronous calls (->) carry their reply (-->): the prune returns what it</text><text x="594.543" y="577.286" fill="#000" font-size="13" textLength="503.496">deleted and the read returns the lines. The bare ->> arrows are the gateway</text><text x="594.543" y="592.418" fill="#000" font-size="13" textLength="284.159">appending a line, which it does not wait on.</text><text x="594.543" y="607.551" fill="#000" font-size="13" textLength="478.448">With no per-run files, the streams configured in the class config are read;</text><text x="594.543" y="622.684" fill="#000" font-size="13" textLength="411.728">auditing stdin reads a captured `podman logs` stream instead.</text><?plantuml-src RLLDR-Cs4BthLmnIe8a1IIwAzk9i3GGea4iB576xlUImj3YskA58bQIiwDBVtZUK7DleNln1pkURzuRtzDVllr7aVmPs3PCswXXKHzxPQKEz2iaqfbSknPAiER0rZl4pJguXvJIf_AlZ6DKH5yKz1Uwj4HlDLaqnMpcVv6J-IJwr72wPGgw0BNVi4gMfvvh-R1cXuh3_oaqY4ocr2dSjangqIHHJODL5yaEoviJvfl4kAPGNPk