="571.219" width="264.742" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="545.427" y="591.214" fill="#000" font-size="14" textLength="58.447">state dir</text><text x="449.28" y="607.511" fill="#000" font-size="14" textLength="250.742">/.local/state/agentjail/audit/&lt;class></text></g><g class="participant participant-tail" data-qualified-name="R" data-entity-uid="part3" id="part3-tail" data-source-line="11"><rect x="845.729" y="571.219" width="157.787" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="852.729" y="591.214" fill="#000" font-size="14" textLength="143.787">next run of the class</text><text x="880.302" y="607.511" fill="#000" font-size="14" textLength="88.642">agentjail run</text></g><g class="participant participant-tail" data-qualified-name="A" data-entity-uid="part4" id="part4-tail" data-source-line="12"><rect x="1013.516" y="571.219" width="226.83" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1096.825" y="591.214" fill="#000" font-size="14" textLength="60.211">operator</text><text x="1020.516" y="607.511" fill="#000" font-size="14" textLength="212.83">agentjail audit --class &lt;class></text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1" data-source-line="14"><polygon points="562.651,150.289,572.651,154.289,562.651,158.289,566.651,154.289" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="207.617" y1="154.289" x2="568.651" y2="154.289" style="stroke:#181818;stroke-width:1;"/><text x="214.617" y="118.958" fill="#000" font-size="13" textLength="118.39">&lt;jail-id>.audit.log</text><text x="214.617" y="134.09" fill="#000" font-size="13" textLength="304.408">one line per decision: allow (resolved, pinned),</text><text x="214.617" y="149.223" fill="#000" font-size="13" textLength="221.038">allow-close (bytes), deny (reason)</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg2" data-source-line="15"><polygon points="562.651,194.555,572.651,198.555,562.651,202.555,566.651,198.555" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="207.617" y1="198.555" x2="568.651" y2="198.555" style="stroke:#181818;stroke-width:1;"/><text x="214.617" y="178.356" fill="#000" font-size="13" textLength="108.488">&lt;jail-id>.dns.log</text><text x="214.617" y="193.489" fill="#000" font-size="13" textLength="343.034">one line per query: answer, nxdomain, refused, drop</text></g><path d="M15,211.555 L15,251.555 L400,251.555 L400,221.555 L390,211.555 L15,211.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M390,211.555 L390,221.555 L400,221.555 L390,211.555" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="21" y="228.622" fill="#000" font-size="13" textLength="364.235">written at decision time, not when the connection ends:</text><text x="21" y="243.754" fill="#000" font-size="13" textLength="357.963">a tunnel that is established and then reset is still a line</text><text x="341.104" y="281.031" fill="#000" font-size="11" textLength="652.341">run over: the jail, started with --rm, is gone; the gateway, which has no --rm, was removed by the run's cleanup guard</text><path d="M320.995,302.625 L320.995,372.625 L827.995,372.625 L827.995,312.625 L817.995,302.625 L320.995,302.625" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M817.995,302.625 L817.995,312.625 L827.995,312.625 L817.995,302.625" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="326.995" y="319.692" fill="#000" font-size="13" textLength="480.822">The record is this directory, not the container log. The gateway carries no</text><text x="326.995" y="334.825" fill="#000" font-size="13" textLength="469.739">--rm on purpose: a gateway that refuses to start keeps its exit code and</text><text x="326.995" y="349.958" fill="#000" font-size="13" textLength="486.313">its output, which is how the refusal is reported. A gateway left behind by a</text><text x="326.995" y="365.09" fill="#000" font-size="13" textLength="303.132">killed run is pruned by dead pid on a later run.</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg3" data-source-line="24"><polygon points="585.651,410.422,575.651,414.422,585.651,418.422,581.651,414.422" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="579.651" y1="414.422" x2="923.622" y2="414.422" style="stroke:#181818;stroke-width:1;"/><text x="591.651" y="394.223" fill="#000" font-size="13" textLength="325.971">prune at start: keep the newest 20 runs per class,</text><text x="591.651" y="409.356" fill="#000" font-size="13" textLength="191.28">delete both files of the oldest</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg4" data-source-line="25"><polygon points="585.651,454.688,575.651,458.688,585.651,462.688,581.651,458.688" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="579.651" y1="458.688" x2="1125.931" y2="458.688" style="stroke:#181818;stroke-width:1;"/><text x="591.651" y="438.489" fill="#000" font-size="13" textLength="234.609">read both streams, newest run first,</text><text x="591.651" y="453.622" fill="#000" font-size="13" textLength="130.768">merge in time order</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg5" data-source-line="26"><polygon points="1114.931,498.953,1124.931,502.953,1114.931,506.953,1118.931,502.953" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="574.651" y1="502.953" x2="1120.931" y2="502.953" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="581.651" y="482.754" fill="#000" font-size="13" textLength="178.82">key=value lines, filtered by</text><text x="581.651" y="497.887" fill="#000" font-size="13" textLength="175.297">class, jail, decision, stream</text></g><path d="M877.207,515.953 L877.207,555.953 L1376.207,555.953 L1376.207,525.953 L1366.207,515.953 L877.207,515.953" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1366.207,515.953 L1366.207,525.953 L1376.207,525.953 L1366.207,515.953" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="883.207" y="533.02" fill="#000" font-size="13" textLength="478.448">With no per-run files, the streams configured in the class config are read;</text><text x="883.207" y="548.153" fill="#000" font-size="13" textLength="411.728">auditing stdin reads a captured `podman logs` stream instead.</text><?plantuml-src RLN1Zjj63BthAuWjaCq2abmKpSMRBh10WRsaG16toMKF6MjeQRAZ6NLcPAqk_VO-ZkIrZUPY6qFoyP5yf6_fxpy-KUH_HdODapQg3Qedx-oyfK65P1epA9TYITOSs1h7-DbpZAgLNu7J65miYrlIRDKSIJbDpYSnBZ_9fux36Jhab6ovPvSepGFNz5V75CVzTsuIcGYmr2dOyAf6RHB555ZraVoOh3bojZJU9GK-ON6U0fAAeQyHl_DZG3t-08QD3veEoAjz4pShZxZ9o1LmzLurBtKyjZNzxeKxiUIK7BilJrkW1NOQUV0ucTHbos2SOqr_MZH7wZ4z6aBlSmgb_P2CQ-jUtmcPTp_z-k4-Vw0uKkXaug0itLJLpVOC8LGYLLNYrrHLfAAKRLuOHTT5CicktTXc0dmqEizixKcyRafHN4oFRbgLU5BpsVxi6gjYf8_vw-56qZrTnyI48CmDllzkQkiRPJVvRODINVgkZ5sQkBa4sLs3E1H3ONGoYanGF9_T6uBOSjpdwpW_e4N9XqlNHGldRlw_WiUYUABgWNQqfOyIKndzKESu5D0-E--OHCGqY2IvCT5ujoLbhP_eVU3exP5rkOxthaHwCLMDzH7ZtSyGzbs9I3UBkuhUtVqefNRn1mcnPG5xfLoSE9JaNhNlCGrPeyCO9QyEVYXaVSWV4V04q2cObDWHD7uYJCdqN6QfJXrCw-GTraUiK6lSWZcb4MzssGyeZp6zlJMnWt1bDvF4ecRErfYCjLcTZekwhfUfWSMYDocjX1E6XF2y1-T9XBuKY1RLtcVlLMyb-9ccemwpmIMu3fZm6BX72atxEOSXvMs4HbYvSQ1sLDXSKBdeoAwWV2tMjJOYUtn0fIZUXtdfolLzm22M4_Es1Ie4mq89Q9UaSFXe6CE0OMDCR_wvWSkCaCylNQ0NvY7YAA2nhz1bupLBMm4fRrZBOKod1e1Y1uNb6WK7ss-a-i5BEsjwVCjb-P1epvrnkIiAS2yO37eayq3GWE-bOne70qhLmXfp0q0GfxhWzGONdq_Ap44YeKnzcxbdDeudo89--LaYOrPftYSe7mUTqVOzxZSTZ4Nfwmvxgn5JF9x0vN0jRkkTBa-mGlbWGao0wpdWGff5lFWRm4KjTZXt3oXU2Cs_7PKTbsq10ZAYdbpeUglALOEdBIZNT1VgU4Itleeq8JQKKYtvhU09yTFV2AHnCEqewC