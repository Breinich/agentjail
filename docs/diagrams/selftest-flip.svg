<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="ACTIVITY" style="width:877px;height:931px;background:#FFFFFF;" width="877px" height="931px" viewBox="0 0 877 931" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.10?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="6"><text x="187.512" y="32.995" fill="#000" font-size="14" textLength="500.165" font-weight="700">selftest: the same probe, once without a jail and once with one</text></g><rect x="20" y="55.042" width="830.188" height="20.953" fill="none" style="stroke:none;"/><ellipse cx="242.486" cy="90.995" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="98.365" y="120.995" width="288.242" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="108.365" y="142.134" fill="#000" font-size="12" textLength="268.242">run agentjail __probe as a plain host process</text><text x="108.365" y="156.103" fill="#000" font-size="12" textLength="121.096">(no podman, no jail)</text><polygon points="151.609,188.933,333.362,188.933,345.362,200.933,333.362,212.933,151.609,212.933,139.609,200.933,151.609,188.933" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="151.609" y="204.741" fill="#000" font-size="11" textLength="181.752">the hazard happens on the host?</text><text x="120.601" y="198.338" fill="#000" font-size="11" textLength="19.008">yes</text><text x="345.362" y="198.338" fill="#000" font-size="11" textLength="13.702">no</text><rect x="26" y="222.933" width="207.219" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="36" y="244.071" fill="#000" font-size="12" textLength="187.219">EXPECTED: the negative is real</text><rect x="255.895" y="222.933" width="198.934" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="265.895" y="244.071" fill="#000" font-size="12" textLength="178.934">FAIL: the assertion is vacuous</text><polygon points="242.486,262.901,254.486,274.901,242.486,286.901,230.486,274.901,242.486,262.901" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><ellipse cx="242.486" cy="317.901" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="242.486" cy="317.901" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/><line x1="20" y1="55.042" x2="20" y2="826.683" style="stroke:#000;stroke-width:1.5;"/><ellipse cx="642.632" cy="348.901" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/><rect x="464.829" y="378.901" width="355.607" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="474.829" y="400.04" fill="#000" font-size="12" textLength="271.178">stage the same binary read-only into the jail,</text><text x="474.829" y="414.009" fill="#000" font-size="12" textLength="335.607">a generated class (address_policy=lan), a fixture target</text><rect x="527.281" y="446.839" width="230.703" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="537.281" y="467.978" fill="#000" font-size="12" textLength="210.703">run agentjail __probe inside the jail</text><polygon points="578.23,500.808,707.034,500.808,719.034,512.808,707.034,524.808,578.23,524.808,566.23,512.808,578.23,500.808" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="578.23" y="516.616" fill="#000" font-size="11" textLength="128.804">the negative is denied?</text><text x="547.222" y="510.213" fill="#000" font-size="11" textLength="19.008">yes</text><text x="719.034" y="510.213" fill="#000" font-size="11" textLength="13.702">no</text><rect x="530.89" y="534.808" width="50.68" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="540.89" y="555.946" fill="#000" font-size="12" textLength="30.68">PASS</text><rect x="613.741" y="534.808" width="230.586" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="623.741" y="555.946" fill="#000" font-size="12" textLength="210.586">FAIL: names the case that escaped</text><polygon points="642.632,574.776,654.632,586.776,642.632,598.776,630.632,586.776,642.632,574.776" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="478.985" y="618.776" width="327.295" height="47.938" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="488.985" y="639.915" fill="#000" font-size="12" textLength="298.418">positive control: one granted destination answers</text><text x="488.985" y="653.884" fill="#000" font-size="12" textLength="307.295">through the gateway and its audit line is read back</text><polygon points="578.222,686.714,707.042,686.714,719.042,698.714,707.042,710.714,578.222,710.714,566.222,698.714,578.222,686.714" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="578.222" y="702.522" fill="#000" font-size="11" textLength="128.82">answered and audited?</text><text x="547.214" y="696.12" fill="#000" font-size="11" textLength="19.008">yes</text><text x="719.042" y="696.12" fill="#000" font-size="11" textLength="13.702">no</text><rect x="530.882" y="720.714" width="50.68" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="540.882" y="741.853" fill="#000" font-size="12" textLength="30.68">PASS</text><rect x="706.375" y="720.714" width="45.336" height="33.969" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="716.375" y="741.853" fill="#000" font-size="12" textLength="25.336">FAIL</text><polygon points="642.632,76