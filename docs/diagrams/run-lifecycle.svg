027" y="95.995" fill="#000" font-size="14" textLength="130.669">gateway container</text><text x="920.606" y="112.292" fill="#000" font-size="14" textLength="127.511">class, dual-homed</text></g><g class="participant participant-head" data-qualified-name="J" data-entity-uid="part5" id="part5-head" data-source-line="11"><rect x="1255.518" y="76" width="105.034" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1262.518" y="95.995" fill="#000" font-size="14" textLength="91.034">jail container</text><text x="1272.717" y="112.292" fill="#000" font-size="14" textLength="70.636">uid 10000</text></g><g class="participant participant-tail" data-qualified-name="H" data-entity-uid="part1" id="part1-tail" data-source-line="7"><text x="10" y="856.44" fill="#000" font-size="14" textLength="60.211">operator</text><ellipse cx="43.105" cy="868.242" rx="8" ry="8" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;"/><path d="M43.105,876.242 L43.105,903.242 M30.105,884.242 L56.105,884.242 M43.105,903.242 L30.105,918.242 M43.105,903.242 L56.105,918.242" style="stroke:#181818;stroke-width:0.5;" fill="none"/></g><g class="participant participant-tail" data-qualified-name="C" data-entity-uid="part2" id="part2-tail" data-source-line="8"><rect x="338.339" y="843.445" width="74.689" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="345.339" y="863.44" fill="#000" font-size="14" textLength="60.689">agentjail</text><text x="363.933" y="879.737" fill="#000" font-size="14" textLength="23.502">run</text></g><g class="participant participant-tail" data-qualified-name="P" data-entity-uid="part3" id="part3-tail" data-source-line="9"><rect x="830.599" y="843.445" width="71.429" height="30.297" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="837.599" y="863.44" fill="#000" font-size="14" textLength="57.429">podman</text></g><g class="participant participant-tail" data-qualified-name="G" data-entity-uid="part4" id="part4-tail" data-source-line="10"><rect x="912.027" y="843.445" width="144.669" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="919.027" y="863.44" fill="#000" font-size="14" textLength="130.669">gateway container</text><text x="920.606" y="879.737" fill="#000" font-size="14" textLength="127.511">class, dual-homed</text></g><g class="participant participant-tail" data-qualified-name="J" data-entity-uid="part5" id="part5-tail" data-source-line="11"><rect x="1255.518" y="843.445" width="105.034" height="46.594" fill="#E2E2F0" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1262.518" y="863.44" fill="#000" font-size="14" textLength="91.034">jail container</text><text x="1272.717" y="879.737" fill="#000" font-size="14" textLength="70.636">uid 10000</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1" data-source-line="13"><polygon points="363.684,148.727,373.684,152.727,363.684,156.727,367.684,152.727" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="43.105" y1="152.727" x2="369.684" y2="152.727" style="stroke:#181818;stroke-width:1;"/><text x="50.105" y="147.661" fill="#000" font-size="13" textLength="308.579">agentjail run &lt;profile> -- &lt;agent command…></text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg2" data-source-line="14"><line x1="375.684" y1="196.992" x2="417.684" y2="196.992" style="stroke:#181818;stroke-width:1;"/><line x1="417.684" y1="196.992" x2="417.684" y2="209.992" style="stroke:#181818;stroke-width:1;"/><line x1="376.684" y1="209.992" x2="417.684" y2="209.992" style="stroke:#181818;stroke-width:1;"/><polygon points="386.684,205.992,376.684,209.992,386.684,213.992,382.684,209.992" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="382.684" y="176.793" fill="#000" font-size="13" textLength="206.673">load, validate, run the blockers,</text><text x="382.684" y="191.926" fill="#000" font-size="13" textLength="239.357">resolve the class, compute the grant</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3" data-source-line="15"><polygon points="854.313,250.258,864.313,254.258,854.313,258.258,858.313,254.258" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.684" y1="254.258" x2="860.313" y2="254.258" style="stroke:#181818;stroke-width:1;"/><text x="382.684" y="234.059" fill="#000" font-size="13" textLength="206.527">image inspect the gateway tag,</text><text x="382.684" y="249.192" fill="#000" font-size="13" textLength="284.299">then start the container by ID, never by tag</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg4" data-source-line="16"><polygon points="854.313,294.523,864.313,298.523,854.313,302.523,858.313,298.523" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.684" y1="298.523" x2="860.313" y2="298.523" style="stroke:#181818;stroke-width:1;"/><text x="382.684" y="278.325" fill="#000" font-size="13" textLength="375.02">prune containers and networks whose owning pid is dead</text><text x="382.684" y="293.458" fill="#000" font-size="13" textLength="194.486">(never by profile prefix alone)</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg5" data-source-line="17"><polygon points="854.313,338.789,864.313,342.789,854.313,346.789,858.313,342.789" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.684" y1="342.789" x2="860.313" y2="342.789" style="stroke:#181818;stroke-width:1;"/><text x="382.684" y="322.59" fill="#000" font-size="13" textLength="334.706">network create --internal &lt;profile>-&lt;pid>-&lt;class></text><text x="382.684" y="337.723" fill="#000" font-size="13" textLength="260.165">network create &lt;profile>-&lt;pid>-egress</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg6" data-source-line="18"><polygon points="854.313,367.922,864.313,371.922,854.313,375.922,858.313,371.922" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.684" y1="371.922" x2="860.313" y2="371.922" style="stroke:#181818;stroke-width:1;"/><text x="382.684" y="366.856" fill="#000" font-size="13" textLength="104.044">network inspect</text></g><path d="M116.337,384.922 L116.337,439.922 L634.337,439.922 L634.337,394.922 L624.337,384.922 L116.337,384.922" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M624.337,384.922 L624.337,394.922 L634.337,394.922 L624.337,384.922" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="122.337" y="401.989" fill="#000" font-size="13" textLength="456.688">The same verification function `doctor --network` calls: internal=true,</text><text x="122.337" y="417.122" fill="#000" font-size="13" textLength="497.694">a subnet, IPv4 only. A network that changed under you fails before anything</text><text x="122.337" y="432.254" fill="#000" font-size="13" textLength="243.103">starts, and a refusal is not a warning.</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg7" data-source-line="24"><polygon points="854.313,492.719,864.313,496.719,854.313,500.719,858.313,496.719" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.684" y1="496.719" x2="860.313" y2="496.719" style="stroke:#181818;stroke-width:1;"/><text x="382.684" y="461.387" fill="#000" font-size="13" textLength="216.334">run -d gateway on both networks</text><text x="382.684" y="476.52" fill="#000" font-size="13" textLength="265.872">--grant &lt;profile egress ∩ class allowlist></text><text x="382.684" y="491.653" fill="#000" font-size="13" textLength="219.28">--audit-dir &lt;state>/audit/&lt;class></text></g><path d="M989.362,509.719 L989.362,549.719 L1391.362,549.719 L1391.362,519.719 L1381.362,509.719 L989.362,509.719" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M1381.362,509.719 L1381.362,519.719 L1391.362,519.719 L1381.362,509.719" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="995.362" y="526.786" fill="#000" font-size="13" textLength="381.57">An empty grant is announced ("this jail has no route out"),</text><text x="995.362" y="541.918" fill="#000" font-size="13" textLength="345.731">not refused: the gateway starts and permits nothing.</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg8" data-source-line="29"><polygon points="854.313,587.25,864.313,591.25,854.313,595.25,858.313,591.25" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.684" y1="591.25" x2="860.313" y2="591.25" style="stroke:#181818;stroke-width:1;"/><text x="382.684" y="571.051" fill="#000" font-size="13" textLength="323.857">read the gateway's address on the class network,</text><text x="382.684" y="586.184" fill="#000" font-size="13" textLength="223.031">and fail the run if it never appears</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg9" data-source-line="30"><polygon points="854.313,631.516,864.313,635.516,854.313,639.516,858.313,635.516" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.684" y1="635.516" x2="860.313" y2="635.516" style="stroke:#181818;stroke-width:1;"/><text x="382.684" y="615.317" fill="#000" font-size="13" textLength="265.77">run jail --network class --dns &lt;gateway></text><text x="382.684" y="630.45" fill="#000" font-size="13" textLength="466.629">--dns-search . --env HTTPS_PROXY/ALL_PROXY=http://&lt;gateway>:3128</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg10" data-source-line="31"><polygon points="995.362,660.648,985.362,664.648,995.362,668.648,991.362,664.648" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="989.362" y1="664.648" x2="1307.035" y2="664.648" style="stroke:#181818;stroke-width:1;"/><text x="1001.362" y="659.583" fill="#000" font-size="13" textLength="299.673">CONNECT host:port, the jail has no other peer</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg11" data-source-line="32"><polygon points="363.684,689.781,373.684,693.781,363.684,697.781,367.684,693.781" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="43.105" y1="693.781" x2="369.684" y2="693.781" style="stroke:#181818;stroke-width:1;"/><text x="50.105" y="688.715" fill="#000" font-size="13" textLength="172.434">SIGINT, SIGTERM, SIGQUIT</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg12" data-source-line="33"><polygon points="854.313,718.914,864.313,722.914,854.313,726.914,858.313,722.914" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.684" y1="722.914" x2="860.313" y2="722.914" style="stroke:#181818;stroke-width:1;"/><text x="382.684" y="717.848" fill="#000" font-size="13" textLength="262.044">forward the signal to podman, then wait</text></g><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg13" data-source-line="34"><polygon points="386.684,748.047,376.684,752.047,386.684,756.047,382.684,752.047" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="380.684" y1="752.047" x2="865.313" y2="752.047" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="392.684" y="746.981" fill="#000" font-size="13" textLength="168.003">exit code, or 128 + signal</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg14" data-source-line="35"><polygon points="854.313,792.313,864.313,796.313,854.313,800.313,858.313,796.313" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="375.684" y1="796.313" x2="860.313" y2="796.313" style="stroke:#181818;stroke-width:1;"/><text x="382.684" y="776.114" fill="#000" font-size="13" textLength="306.49">remove the gateway, then the egress network,</text><text x="382.684" y="791.247" fill="#000" font-size="13" textLength="275.907">then the class network, on every exit path</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg15" data-source-line="36"><polygon points="54.105,821.445,44.105,825.445,54.105,829.445,50.105,825.445" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="48.105" y1="825.445" x2="374.684" y2="825.445" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="60.105" y="820.379" fill="#000" font-size="13" textLength="200.053">exit with the agent's own code</text></g><?plantuml-src TLNHRjis57tNLrnum99Wahrk7J1ugO70BH8NQUerxh011XP6lBAuoAH6KdRyjiTzoO3zLhzaXvHisIsM1qKcxpqyzzp3gpFw-EwM7F_PiCwPf18hAzPZCfhfmJRw8QN2cZNLbejAhKfFtf1bKG-JCxetZKMIAR2I6okfC9QaoTsemt4ZG6ILAZZVvHKFtMOrfDU6jF74KW6iPBh_vNeCCCjQiYKiRfKluqwjj6P9yqfe7sYgjLWndSSJX3IrLterNCkBmENhhrx-y5Dya78ag5AUhQXea6M3SGy1wj9Hbdb-zbb6mf7pLZsnQVmmySfNJA0yxkjDgMQROOqq-wsnJocjXEUjsFKyKQf6u1z2LMaK9qb4xg75m21Pu6qGJhf9Qc6zobMDS1gW5kr3pb83FaPCJoDg8zUYtPcVxkmfv4PxeJJRfSuhuLnAiX5LLferovXtVPeNZZjEQfIa5z_YBmQ_JP8RoYOqfJ4Ts0KzwBAsfb0LJuvrlemnW5k3fVpqrp-JPBfFhuoGAMr4fIIefX4aIFLOcVo9hKjHD3jJRJWkT-G1LJUUUr5Rm3a0szuhxMhEMz_iDV1Y1JIiQFGInRQ0-nhfSKUprocwjsb_8Bn7hS7hA1Z6qNBVQ4VRqZZOUwlXCvXH1cT966YfpmzmdJ3HCEgPH8MRSz4Vq65H3bkWi5uzfU5F3OCUfCqkSGIUKOl9Kd-M-daSho2W-_AaJg84TmpS0yjfGhI09awicR2W2fKBhuocej5vV7d0dGg6xVbrS0-KYwfoqB_Z-yhRXbCW2dBD8w9IciqtBp4mgjsGhWuqV2bWZLBe5Mvm4w_spZHKm56E7XcJWY7spfVG5cYnSt10q5_W3XMDWpRGEumAGLjXGnE62OV-eBA