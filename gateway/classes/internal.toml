# Egress class `internal`: the homelab services an agent may use, reached by
# name inside the LAN. Deny by default; every entry is deliberate.
#
# Names here are resolved by the gateway itself, so the jail never needs a route
# or a resolver into the LAN: the class network stays internal.

class = "internal"

listen = "0.0.0.0:3128"
dns = "0.0.0.0:53"
dns_policy = "allowlist"

audit_log = "-"
dns_log = "-"

# Budget and cap: LAN services are small and few, so this class is the tightest.
max_bytes = 134217728
max_connections = 4

# `lan` is the one relaxation this build ships, and it is the reason this class
# exists: a named LAN service resolves to RFC1918 or ULA space, so `public`
# would refuse every name here. Loopback, link-local, CGNAT, multicast,
# unspecified, and the IPv4-mapped spellings stay refused even here.
address_policy = "lan"

allow = [
  "git.internal:443",
  "registry.internal:443",
  "wiki.internal:443",
]
