# Egress class `internal`: the homelab services an agent may use, reached by
# name inside the LAN. Deny by default; every entry is deliberate.
#
# Names here are resolved by the gateway itself, so the jail never needs a route
# or a resolver into the LAN: the class network stays internal.

class = "internal"

listen = "0.0.0.0:3128"
dns = "0.0.0.0:53"
dns_policy = "allowlist"

audit_log = "-"
dns_log = "-"

allow = [
  "git.internal:443",
  "registry.internal:443",
  "wiki.internal:443",
]
