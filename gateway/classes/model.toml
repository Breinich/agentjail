# Egress class `model`: the LLM APIs a coding agent talks to.
#
# This file is the whole policy for the class. The gateway reads it once at
# start; nothing here is mutated at runtime, and `agentjail run` refuses a
# profile whose network.egress is not a subset of it.
#
# The class is identified by the internal podman network the jail joins, not by
# a rule inside a shared proxy: the agent cannot change its network membership
# from inside the jail.

class = "model"

# CONNECT listener, inside the class network only.
listen = "0.0.0.0:3128"
# DNS listener (UDP). The jail is started with --dns <this gateway's address>.
dns = "0.0.0.0:53"
# allowlist: answer allowlisted names (pinned to 127.0.0.1), NXDOMAIN the rest.
dns_policy = "allowlist"

# Both `-` streams: audit on stdout, DNS on stderr, so the two never mix.
audit_log = "-"
dns_log = "-"

# Limits: an allowlisted destination with no size limit is an exfiltration
# channel with a receipt. `max_bytes` is this jail's budget, both directions
# together; `max_connections` is how many tunnels it may hold open. Reaching
# either is a refusal logged like a policy denial, with the counters that
# caused it.
max_bytes = 268435456
max_connections = 8

# Which ranges an allowlisted name may resolve to. `public` refuses every answer
# that is not globally routable, so a rebound or poisoned name cannot point this
# class at loopback, the metadata address, or the LAN.
address_policy = "public"

# `host` means port 443. `*.suffix` covers subdomains only, never the apex.
#
# Every host here is one an agent's own model traffic needs; a name that is
# missing does not degrade the agent, it stops it. A jailed agent whose class
# is wrong starts, lists its tools, and then cannot answer a single prompt —
# the failure looks like a broken agent, not like a missing allowlist entry.
#
# opencode.ai: the opencode zen gateway (`/inference/go/…`) used by Pi's
# `opencode-go` provider. Verified by driving one real turn through a CONNECT
# proxy and reading the CONNECT line it emits.
allow = [
  "api.anthropic.com:443",
  "opencode.ai:443",
  "console.anthropic.com:443",
  "statsig.anthropic.com:443",
  "api.openai.com:443",
  "openrouter.ai:443",
  "generativelanguage.googleapis.com:443",
]
