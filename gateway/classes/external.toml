# Egress class `external`: public registries, package mirrors, and documentation
# a coding agent legitimately fetches from. Nothing that resolves to the LAN.

class = "external"

listen = "0.0.0.0:3128"
dns = "0.0.0.0:53"
dns_policy = "allowlist"

audit_log = "-"
dns_log = "-"

# Budget and cap: 1 GiB per jail both directions, 8 tunnels at a time. A
# registry fetch is large, but it is not unlimited.
max_bytes = 1073741824
max_connections = 8

# Public space only, for the same reason as `model`: this class fetches from
# the internet, and an answer that lands anywhere else is a rebind, not a
# destination somebody listed.
address_policy = "public"

allow = [
  "github.com:443",
  "api.github.com:443",
  "codeload.github.com:443",
  "objects.githubusercontent.com:443",
  "raw.githubusercontent.com:443",
  "codeberg.org:443",
  "crates.io:443",
  "static.crates.io:443",
  "index.crates.io:443",
  "registry.npmjs.org:443",
  "pypi.org:443",
  "files.pythonhosted.org:443",
  "*.debian.org:443",
  "docs.rs:443",
]
